[package]
name = "stonefish_ai"
version = "1.0.0"
edition = "2021"
description = "From-scratch autograd engine and language-model stack in Rust — zero dependencies"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Edipcm-hash/stonefish"
keywords = ["llm", "transformer", "autograd", "cuda", "from-scratch"]
categories = ["algorithms", "science"]

[features]
# On machines without CUDA: cargo test --no-default-features
default = ["cuda"]
# CUDA access goes through our own FFI (src/sys) - no external crate.
cuda = []

# ============================================================
# NO DEPENDENCIES.
# The CUDA driver / cuBLAS / NVRTC are loaded dynamically at runtime
# (src/sys/mod.rs: LoadLibraryW / dlopen).
# ============================================================
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
