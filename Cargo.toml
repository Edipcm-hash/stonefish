[package]
name = "stonefish_ai"
version = "1.0.0"
edition = "2021"
description = "From-scratch autograd engine and language-model stack in Rust — zero dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/stonefish"
keywords = ["llm", "transformer", "autograd", "cuda", "from-scratch"]
categories = ["science", "algorithms"]

[features]
# CUDA'sı olmayan makinelerde: cargo test --no-default-features
default = ["cuda"]
# CUDA erişimi kendi FFI'mizle (src/sys) yapılır — harici crate YOK.
cuda = []

# ============================================================
# BAĞIMLILIK YOK.
# CUDA sürücüsü / cuBLAS / NVRTC çalışma zamanında dinamik yüklenir
# (src/sys/mod.rs: LoadLibraryW / dlopen).
# ============================================================
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
