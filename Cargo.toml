[package]
name = "stonefish_ai"
version = "0.7.0"
edition = "2021"

[features]
# CUDA'sı olmayan makinelerde: cargo test --no-default-features
default = ["cuda"]
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19", features = ["cuda-13040"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
