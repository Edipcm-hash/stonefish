name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # CPU-only build + all CPU tests. Also proves that the project
  # builds and tests on a runner without a GPU (a designed feature).
  cpu-only:
    name: CPU-only build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --release --no-default-features

  # CUDA build: no driver here, so only compilation + clippy.
  # (GPU tests need real hardware; reported separately in the README.)
  cuda-build:
    name: CUDA feature build (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (cuda feature)
        run: cargo clippy --all-targets --features cuda -- -D warnings
      - name: Build
        run: cargo build --release --features cuda

  # Proof of the zero-dependency claim: the tree must be a single line.
  zero-deps:
    name: Zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo tree must be a single line
        run: |
          LINES=$(cargo tree --all-features | wc -l)
          cargo tree --all-features
          if [ "$LINES" -ne 1 ]; then
            echo "❌ Dependency found: $LINES lines (expected 1)"
            exit 1
          fi
          echo "✅ Zero dependencies verified"
